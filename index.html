<!DOCTYPE html>
    <html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Login</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f4f4f4;
            }

            .login-container {
                width: 300px;
                margin: 100px auto;
                padding: 20px;
                background: white;
                border-radius: 8px;
                box-shadow: 0 0 10px rgba(0,0,0,0.1);
            }

            input {
                width: 100%;
                padding: 8px;
                margin: 8px 0;
            }

            button {
                width: 100%;
                padding: 10px;
                background-color: #007BFF;
                color: white;
                border: none;
                cursor: pointer;
            }

            button:hover {
                background-color: #0056b3;
            }

            .error {
                color: red;
                font-size: 0.9em;
            }

            #login-message {
                text-align: center;
                margin-top: 20px;
                font-size: 1.2em;
                width: 50vw;
                word-wrap: break-word;

            }
        </style>
    </head>
    <body>

        <div class="login-container">
            <h2>Iniciar Sesión</h2>
            <form id="loginForm">

                <label for="email">Usuario (Correo electrónico)</label>
                <input type="email" id="email" name="email" required>

                <label for="password">Contraseña</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    required
                    title="Debe contener al menos una mayúscula, un número y un carácter especial."
                >

                <div id="errorMsg" class="error"></div>

                <button type="submit">Ingresar</button>

            </form>
        </div>

        <span id="login-message"></span>

        <script>

            document.getElementById("loginForm").addEventListener("submit", async function(event) {
                event.preventDefault();

                const email = document.getElementById("email").value;
                const password = document.getElementById("password").value;
                const errorMsg = document.getElementById("errorMsg");

                const response = await fetch("http://localhost:3000/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    errorMsg.textContent = "";
                    localStorage.setItem("token", data.token);
                    document.getElementById("login-message").textContent = "Login exitoso con token: " + data.token;
                    console.log("Token:", data.token);
                } else {
                    errorMsg.textContent = data.message ? data.message : "Error en el login";
                }
            });

        </script>

    </body>
</html>
